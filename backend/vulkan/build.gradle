archivesBaseName = "joid-backend-vulkan"

dependencies {
    compile project(':base-lwjgl3-glfw')
    compile project(':base-lwjgl3-openal')
    compile project(':base-openal')

    compile "org.lwjgl:lwjgl-vulkan:$lwjglVersion"
    compile "org.lwjgl:lwjgl-shaderc:$lwjglVersion"
    runtime "org.lwjgl:lwjgl:$lwjglVersion:$lwjglNatives"
    runtime "org.lwjgl:lwjgl-glfw:$lwjglVersion:$lwjglNatives"
    runtime "org.lwjgl:lwjgl-openal:$lwjglVersion:$lwjglNatives"
    runtime "org.lwjgl:lwjgl-shaderc:$lwjglVersion:$lwjglNatives"
    if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
        runtime "org.lwjgl:lwjgl-vulkan:$lwjglVersion:$lwjglNatives"
    }
}

ext.demoMain = 'dev.joid.backend.vulkan.demo.DemoWindow'

apply from: rootProject.file('gradle/backend.gradle')

test {
    systemProperty 'org.lwjgl.system.stackSize', 1024
}