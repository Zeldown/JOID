archivesBaseName = "joid-backend-lwjgl2"

evaluationDependsOn(':base-opengl')

configurations {
    natives
    shade
    compile.extendsFrom shade
}

dependencies {
    compile project(':base-openal')
    compile project(':base-opengl')

    compile "org.lwjgl.lwjgl:lwjgl:2.9.1"

    shade "net.java.dev.jna:jna:5.17.0"

    natives "org.lwjgl.lwjgl:lwjgl-platform:2.9.1:natives-windows"
    natives "org.lwjgl.lwjgl:lwjgl-platform:2.9.1:natives-linux"
    natives "org.lwjgl.lwjgl:lwjgl-platform:2.9.1:natives-osx"

    testCompile project(':base-opengl').sourceSets.test.output
}

task extractNatives(type: Sync) {
    description = 'Unpacks the LWJGL 2 natives of every platform into the resources of the backend.'
    into "$buildDir/natives/dev/joid/backend/lwjgl2/natives"
    ['windows', 'linux', 'osx'].each { platform ->
        from({ zipTree(configurations.natives.files.find { file -> file.name.endsWith("natives-${platform}.jar") }) }) {
            into platform
            exclude '**/*jinput*', 'META-INF/**'
        }
    }
}

sourceSets.main.resources.srcDir "$buildDir/natives"
processResources.dependsOn extractNatives

ext.demoMain = 'dev.joid.backend.lwjgl2.demo.DemoWindow'

apply from: rootProject.file('gradle/backend.gradle')