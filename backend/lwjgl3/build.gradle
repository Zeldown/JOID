archivesBaseName = "joid-backend-lwjgl3"

evaluationDependsOn(':base-opengl')

dependencies {
    compile project(':base-glfw')
    compile project(':base-openal')
    compile project(':base-opengl')

    compile "org.lwjgl:lwjgl-opengl:$lwjglVersion"
    runtime "org.lwjgl:lwjgl-opengl:$lwjglVersion:$lwjglNatives"

    testCompile project(':base-opengl').sourceSets.test.output
}

ext.demoMain = 'dev.joid.backend.lwjgl3.demo.DemoWindow'

apply from: rootProject.file('gradle/backend.gradle')

test {
    def profile = project.hasProperty('glProfile') ? project.property('glProfile') : 'DEFAULT'
    inputs.property 'glProfile', profile
    systemProperty 'joid.snapshot.profile', profile
}