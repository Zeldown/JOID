def embeddedModules = []
def collectModules
collectModules = { current ->
    current.configurations.compile.dependencies.withType(ProjectDependency).each { dependency ->
        def module = dependency.dependencyProject
        if (!embeddedModules.contains(module)) {
            evaluationDependsOn(module.path)
            embeddedModules << module
            collectModules(module)
        }
    }
}
collectModules(project)

shadowJar {
    embeddedModules.each { module ->
        from module.sourceSets.main.output
    }

    configurations = [project(':core').configurations.shadow]
    classifier = project.hasProperty('dev') ? 'dev' : 'prod'

    if (!project.hasProperty('dev')) {
        exclude 'assets/demo/*'
    }
}

build.dependsOn shadowJar


dependencies {
    testCompile project(':core').sourceSets.test.output
}

test {
    def references = file('src/test/snapshots')
    def output = rootProject.file("build/snapshots/${project.name}")

    workingDir = file("$buildDir/snapshot")
    inputs.dir references
    inputs.property 'updateSnapshots', project.hasProperty('updateSnapshots')
    outputs.dir output

    systemProperty 'joid.snapshot.references', references.absolutePath
    systemProperty 'joid.snapshot.output', output.absolutePath
    systemProperty 'joid.snapshot.update', project.hasProperty('updateSnapshots')

    testLogging {
        exceptionFormat 'full'
        events 'failed'
    }

    doFirst {
        delete workingDir, output
        workingDir.mkdirs()
    }
}