def embeddedModules = []
def collectModules
collectModules = { current ->
    current.configurations.compile.dependencies.withType(ProjectDependency).each { dependency ->
        def module = dependency.dependencyProject
        if (!embeddedModules.contains(module)) {
            evaluationDependsOn(module.path)
            embeddedModules << module
            collectModules(module)
        }
    }
}
collectModules(project)

def shadowJarType = plugins.getPlugin('com.github.johnrengelman.shadow').class.classLoader.loadClass('com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar')

rootProject.variants.each { variant ->
    task("${variant}Jar", type: shadowJarType) {
        group = 'build'
        description = "Builds the ${variant} jar of the backend, with JOID and the modules it uses embedded."
        from sourceSets.main.output
        embeddedModules.each { module ->
            from module.sourceSets.main.output
        }

        configurations = ([project] + embeddedModules).collect { module -> module.configurations.findByName('shade') }.findAll { configuration -> configuration != null }
        classifier = variant
        rootProject.shadeLibraries(it)
        rootProject.excludeVariant(it, variant)
    }

    build.dependsOn "${variant}Jar"
}


sourceSets {
    jarCheck {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}

dependencies {
    compileOnly project(':tool-testkit')
    testCompile project(':tool-testkit')
}

['demo', 'prod'].each { variant ->
    task("test${variant.capitalize()}Jar", type: JavaExec) {
        group = 'verification'
        description = "Starts JOID from the ${variant} jar in a JVM of its own, on a hidden window, and draws a UI."
        dependsOn "${variant}Jar", jarCheckClasses, ':tool-testkit:jar'
        main = "dev.joid.backend.${project.name - 'backend-'}.jar.${(project.name - 'backend-').capitalize()}JarCheck"
        classpath = files(tasks["${variant}Jar"].archivePath) + files({ project(':tool-testkit').jar.archivePath }) + sourceSets.jarCheck.output + configurations.runtime.filter { file -> !file.path.startsWith(rootDir.path) } - files(([project] + embeddedModules).collect { module -> module.configurations.findByName('shade') }.findAll { configuration -> configuration != null })
        args variant
        workingDir = file("$buildDir/jarCheck/$variant")
        systemProperty 'java.awt.headless', true
        systemProperty 'joid.data', file("$buildDir/jarCheck/$variant/data").absolutePath
        if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
            jvmArgs '-XstartOnFirstThread'
        }
        doFirst {
            delete workingDir
            workingDir.mkdirs()
        }
    }
}

task updateSnapshots {
    group = 'JOID'
    description = 'Runs the snapshot tests of this backend and replaces its reference snapshots.'
    dependsOn test
}

test {
    def references = rootProject.file(".snapshots/${project.name}")
    def output = rootProject.file("build/snapshots/${project.name}")

    workingDir = file("$buildDir/snapshot")
    forkEvery = 1
    inputs.files fileTree(references)
    outputs.dir output

    systemProperty 'joid.snapshot.references', references.absolutePath
    systemProperty 'joid.snapshot.output', output.absolutePath
    systemProperty 'joid.snapshot.cache', rootProject.file('.snapshots/cache').absolutePath

    testLogging {
        exceptionFormat 'full'
        events 'failed'
    }

    doFirst {
        delete workingDir, output
        workingDir.mkdirs()
    }
}

gradle.taskGraph.whenReady { graph ->
    def update = graph.hasTask(updateSnapshots)
    test.inputs.property 'updateSnapshots', update
    test.systemProperty 'joid.snapshot.update', update
}

gradle.buildFinished {
    def report = rootProject.file("build/snapshots/${project.name}/report.html")
    if (test.state.failure != null && report.exists()) {
        println "Snapshot report of ${project.name}: ${report.toPath().toUri().toASCIIString()}"
    }
}