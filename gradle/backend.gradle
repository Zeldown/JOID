apply from: rootProject.file('gradle/variants.gradle')
apply from: rootProject.file('gradle/snapshots.gradle')

def backendResources = file("$buildDir/generated/backend")

task backendProperties {
    description = 'Writes the version of JOID the backend is built for into its backend.properties.'
    inputs.property 'version', project.version
    outputs.dir backendResources
    doLast {
        def properties = new File(backendResources, "dev/joid/backend/${project.name - 'backend-'}/backend.properties")
        properties.parentFile.mkdirs()
        properties.text = "version=${project.version}"
    }
}

sourceSets.main.resources.srcDir backendResources
processResources.dependsOn backendProperties

sourceSets {
    jarCheck {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}

dependencies {
    compileOnly project(':tool-testkit')
    testCompile project(':tool-testkit')
}

['demo', 'prod'].each { variant ->
    task("test${variant.capitalize()}Jar", type: JavaExec) {
        group = 'verification'
        description = "Starts JOID from the ${variant} jar in a JVM of its own, on a hidden window, and draws a UI."
        dependsOn "${variant}Jar", jarCheckClasses, ':tool-testkit:jar'
        main = "dev.joid.backend.${project.name - 'backend-'}.jar.${(project.name - 'backend-').capitalize()}JarCheck"
        classpath = files(tasks["${variant}Jar"].archivePath) + files({ project(':tool-testkit').jar.archivePath }) + sourceSets.jarCheck.output + configurations.runtime.filter { file -> !file.path.startsWith(rootDir.path) } - files(([project] + embeddedModules).collect { module -> module.configurations.findByName('shade') }.findAll { configuration -> configuration != null })
        args variant
        workingDir = file("$buildDir/jarCheck/$variant")
        systemProperty 'java.awt.headless', true
        systemProperty 'joid.data', file("$buildDir/jarCheck/$variant/data").absolutePath
        doFirst {
            delete workingDir
            workingDir.mkdirs()
        }
    }
}

task runDemo(type: JavaExec) {
    group = 'JOID'
    description = "Launches the demo window of ${project.name}."
    main = demoMain
    classpath = sourceSets.main.runtimeClasspath
}

if (org.gradle.internal.os.OperatingSystem.current().isMacOsX() && embeddedModules.contains(project(':base-glfw'))) {
    tasks.withType(JavaForkOptions) {
        jvmArgs '-XstartOnFirstThread'
    }
}

snapshotTest(test, rootProject.file(".snapshots/${project.name}"), rootProject.file("build/snapshots/${project.name}"))