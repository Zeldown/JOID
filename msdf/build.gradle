archivesBaseName = "joid-msdf"

jar {
    manifest {
        attributes 'Main-Class': 'dev.joid.msdf.MsdfGenerator'
    }
}

task generateFont(type: JavaExec) {
    group = 'JOID'
    description = 'Packs one font file into a font.msdf atlas, from -Pfont and -Poutput.'
    main = "dev.joid.msdf.MsdfGenerator"
    classpath = sourceSets.main.runtimeClasspath
    args '--font', project.findProperty('font') ?: '',
         '--output', project.findProperty('output') ?: 'build/font',
         '--charset', project.findProperty('charset') ?: file('charset.txt').absolutePath,
         '--range', project.findProperty('range') ?: '24',
         '--width', project.findProperty('width') ?: '2048',
         '--height', project.findProperty('height') ?: '2048'
}

task rebuildFonts(type: JavaExec) {
    group = 'JOID'
    description = 'Regenerates every MSDF atlas of the project from the font files of -Pfonts.'
    main = "dev.joid.msdf.FontRebuilder"
    classpath = sourceSets.main.runtimeClasspath
    args project.findProperty('fonts') ?: '', rootProject.file('core/src/main/resources').absolutePath, file('fonts.txt').absolutePath, file('charset.txt').absolutePath
}