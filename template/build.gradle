apply plugin: 'java'

group = 'com.example.joid'
version = '1.0.0'
archivesBaseName = 'joid-backend-example'

sourceCompatibility = 1.8
targetCompatibility = 1.8

ext {
    joidVersion = '@JOID_VERSION@'
    lwjglVersion = '3.3.4'
    lwjglNatives = org.gradle.internal.os.OperatingSystem.current().isWindows() ? 'natives-windows' : org.gradle.internal.os.OperatingSystem.current().isMacOsX() ? (System.getProperty('os.arch').startsWith('aarch64') ? 'natives-macos-arm64' : 'natives-macos') : 'natives-linux'
    macOs = org.gradle.internal.os.OperatingSystem.current().isMacOsX()
}

repositories {
    mavenCentral()
}

sourceSets {
    demo {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    joidDemo
    joidDev
    joidProd
    embed
    baseline
    compile.extendsFrom joidDemo, embed
    demoCompile.extendsFrom compile
    demoRuntime.extendsFrom runtime
}

def backendResources = file("$buildDir/generated/backend")

task backendProperties {
    description = 'Writes the version of JOID the backend is built for into its backend.properties.'
    inputs.property 'version', joidVersion
    outputs.dir backendResources
    doLast {
        def properties = new File(backendResources, 'com/example/joid/backend/backend.properties')
        properties.parentFile.mkdirs()
        properties.text = "version=$joidVersion"
    }
}

sourceSets.main.resources.srcDir backendResources
processResources.dependsOn backendProperties

dependencies {
    joidDemo files("libs/joid-core-${joidVersion}-demo.jar")
    joidDev files("libs/joid-core-${joidVersion}-dev.jar")
    joidProd files("libs/joid-core-${joidVersion}-prod.jar")

    testCompile files("libs/joid-tool-testkit-${joidVersion}.jar")
    testCompile "junit:junit:4.13.2"

    baseline files("libs/joid-backend-lwjgl3-${joidVersion}-demo.jar")
    ['lwjgl', 'lwjgl-glfw', 'lwjgl-opengl', 'lwjgl-openal'].each { module ->
        baseline "org.lwjgl:$module:$lwjglVersion"
        baseline "org.lwjgl:$module:$lwjglVersion:$lwjglNatives"
    }
}

/* Packaging */
task demoJar(type: Jar) {
    group = 'build'
    description = 'Builds the demo jar, with the JOID core, its dev tools, its demos and the demo window.'
    classifier = 'demo'
    from sourceSets.main.output
    from sourceSets.demo.output
    from({ (configurations.joidDemo + configurations.embed).collect { zipTree(it) } }) {
        exclude 'META-INF/MANIFEST.MF'
    }
}

task devJar(type: Jar) {
    group = 'build'
    description = 'Builds the dev jar, with the JOID core and its dev tools, without the demos or the demo window.'
    classifier = 'dev'
    from sourceSets.main.output
    from({ (configurations.joidDev + configurations.embed).collect { zipTree(it) } }) {
        exclude 'META-INF/MANIFEST.MF'
    }
}

task prodJar(type: Jar) {
    group = 'build'
    description = 'Builds the prod jar, with the JOID core and without its dev tools, its demos or the demo window.'
    classifier = 'prod'
    from sourceSets.main.output
    from({ (configurations.joidProd + configurations.embed).collect { zipTree(it) } }) {
        exclude 'META-INF/MANIFEST.MF'
    }
}

assemble.dependsOn demoJar, devJar, prodJar

/* Tests */
apply from: 'gradle/snapshots.gradle'

task testDemoJar(type: Test) {
    group = 'verification'
    description = 'Runs every test against the demo jar.'
    dependsOn demoJar
    testClassesDir = sourceSets.test.output.classesDir
    classpath = files(demoJar.archivePath) + sourceSets.test.output + configurations.testRuntime - configurations.joidDemo - configurations.embed
}

task testProdJar(type: Test) {
    group = 'verification'
    description = 'Runs the contract and unit tests against the prod jar.'
    dependsOn prodJar
    testClassesDir = sourceSets.test.output.classesDir
    classpath = files(prodJar.archivePath) + sourceSets.test.output + configurations.testRuntime - configurations.joidDemo - configurations.embed
    exclude '**/SnapshotTest.class'
}

snapshotTest(test, file('.snapshots/references'), file("$buildDir/snapshots/$archivesBaseName"))
snapshotTest(testDemoJar, file('.snapshots/references'), file("$buildDir/snapshots/${archivesBaseName}-demo"))
snapshotTest(testProdJar, file('.snapshots/references'), file("$buildDir/snapshots/${archivesBaseName}-prod"))

task renderBaseline(type: JavaExec) {
    group = 'JOID'
    description = 'Renders the snapshot scenarios with the official LWJGL 3 backend.'
    main = 'dev.joid.test.snapshot.SnapshotBaseline'
    classpath = configurations.baseline + files("libs/joid-tool-testkit-${joidVersion}.jar")
    workingDir = file("$buildDir/snapshot/lwjgl3")
    args 'dev.joid.backend.lwjgl3.snapshot.Lwjgl3SnapshotBackend', file("$buildDir/snapshots/lwjgl3").absolutePath
    doFirst {
        delete workingDir
        workingDir.mkdirs()
    }
}

task crossBackendTest(type: JavaExec) {
    group = 'JOID'
    description = 'Compares the snapshots of this backend to the official LWJGL 3 rendering.'
    dependsOn test, renderBaseline
    main = 'dev.joid.test.snapshot.SnapshotComparison'
    classpath = files("libs/joid-tool-testkit-${joidVersion}.jar") + configurations.joidDemo
    args file("$buildDir/snapshots/cross").absolutePath, file("$buildDir/snapshots/lwjgl3").absolutePath, file("$buildDir/snapshots/$archivesBaseName").absolutePath
}

renderBaseline.mustRunAfter test

gradle.buildFinished {
    def report = file("$buildDir/snapshots/cross/report.html")
    if (crossBackendTest.state.failure != null && report.exists()) {
        println "Cross backend report: ${report.toPath().toUri().toASCIIString()}"
    }
}

/* Demo */
task runDemo(type: JavaExec) {
    group = 'JOID'
    description = 'Launches the demo window.'
    main = 'com.example.joid.backend.demo.DemoWindow'
    classpath = sourceSets.demo.runtimeClasspath
}

if (macOs) {
    tasks.withType(JavaForkOptions) {
        jvmArgs '-XstartOnFirstThread'
    }
}
