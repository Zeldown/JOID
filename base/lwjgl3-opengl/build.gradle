archivesBaseName = "joid-base-lwjgl3-opengl"

dependencies {
    compile project(':base-opengl')

    compile "org.lwjgl:lwjgl:$lwjglVersion"
    compile "org.lwjgl:lwjgl-opengl:$lwjglVersion"
    testRuntime "org.lwjgl:lwjgl:$lwjglVersion:$lwjglNatives"
    testRuntime "org.lwjgl:lwjgl-opengl:$lwjglVersion:$lwjglNatives"
}

apply from: rootProject.file('gradle/base.gradle')