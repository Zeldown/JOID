archivesBaseName = "joid-base-lwjgl3-glfw"

dependencies {
    compile project(':core')
    compile project(':base-openal')

    compile "org.lwjgl:lwjgl:$lwjglVersion"
    compile "org.lwjgl:lwjgl-glfw:$lwjglVersion"
    compile "org.lwjgl:lwjgl-openal:$lwjglVersion"
    runtime "org.lwjgl:lwjgl:$lwjglVersion:$lwjglNatives"
    runtime "org.lwjgl:lwjgl-glfw:$lwjglVersion:$lwjglNatives"
    runtime "org.lwjgl:lwjgl-openal:$lwjglVersion:$lwjglNatives"
}

task releaseJar(type: Jar) {
    group = 'build'
    description = 'Builds the released jar of the GLFW bridges, without the demo and snapshot windows of the official backends.'
    destinationDir = file("$buildDir/release")
    from sourceSets.main.output
    exclude 'dev/joid/base/lwjgl3/glfw/demo/**', 'dev/joid/base/lwjgl3/glfw/snapshot/**'
}