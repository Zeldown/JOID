archivesBaseName = "joid-core"

configurations {
    shade
    compile.extendsFrom shade
}

dependencies {
    compile project(':tool-msdf')

    shade("com.google.guava:guava:33.7.2-jre") { transitive = false }
    shade "com.google.guava:failureaccess:1.0.3"
    shade("com.google.code.gson:gson:2.14.0") { transitive = false }

    compileOnly "com.google.j2objc:j2objc-annotations:3.1"
    compileOnly "com.google.errorprone:error_prone_annotations:2.50.0"

    shade "org.apache.commons:commons-lang3:3.21.0"
    shade "commons-io:commons-io:2.22.0"

    shade "com.github.weisj:jsvg:2.0.0"
    shade "com.twelvemonkeys.imageio:imageio-webp:3.12.0"

    shade "org.ow2.asm:asm:9.2"
    shade "org.ow2.asm:asm-tree:9.2"
    shade "org.ow2.asm:asm-analysis:9.2"

    shade("org.bytedeco:javacv:1.5.9") { transitive = false }
    shade "org.bytedeco:javacpp:1.5.9"
    shade("org.bytedeco:ffmpeg:6.0-1.5.9") { transitive = false }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('dev/joid/lib/joid.properties') {
        expand(version: project.version)
    }
}

task testOnJava(type: JavaExec) {
    group = 'verification'
    description = 'Runs the tests that must give the same result on every JDK with the Java installed in -PtestJava.'
    dependsOn testClasses
    onlyIf { project.hasProperty('testJava') }
    classpath = sourceSets.test.runtimeClasspath
    main = 'org.junit.runner.JUnitCore'
    args 'dev.joid.lib.resource.decoder.impl.VectorResourceDecoderTest'
    systemProperty 'joid.data', file("$buildDir/data").absolutePath
    systemProperty 'joid.cache', file("$buildDir/cache").absolutePath
    systemProperty 'joid.version', project.version
    if (project.hasProperty('testJava')) {
        executable = new File(project.property('testJava').toString(), 'bin/java').absolutePath
    }
}

apply from: rootProject.file('gradle/variants.gradle')

build.dependsOn rootProject.installLocalGitHook