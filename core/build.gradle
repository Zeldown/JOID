archivesBaseName = "joid-core"

dependencies {
    compile "com.google.guava:guava:15.0"
    compile "com.google.code.gson:gson:2.2.4"

    compile "org.apache.commons:commons-lang3:3.1"
    compile "org.apache.commons:commons-compress:1.8.1"
    compile "commons-io:commons-io:2.4"

    compile "java3d:vecmath:1.3.1"

    compile("org.bytedeco:javacv:1.5.9") { transitive = false }
    compile "org.bytedeco:javacpp:1.5.9"
    compile("org.bytedeco:ffmpeg:6.0-1.5.9") { transitive = false }

    compile "org.bytedeco:ffmpeg:6.0-1.5.9:windows-x86_64"
    compile "org.bytedeco:ffmpeg:6.0-1.5.9:macosx-x86_64"
    compile "org.bytedeco:ffmpeg:6.0-1.5.9:macosx-arm64"
    compile "org.bytedeco:ffmpeg:6.0-1.5.9:linux-x86_64"
}

task releaseJar(type: Jar) {
    group = 'build'
    description = 'Builds the dev or prod jar of the core, without third-party libraries.'
    from sourceSets.main.output
    classifier = project.hasProperty('dev') ? 'dev' : 'prod'

    if (!project.hasProperty('dev')) {
        exclude 'assets/demo/**'
    }
}

build.dependsOn releaseJar

task updateVersion() {
    group = 'JOID'
    description = 'Writes the project version into JOID.VERSION.'
    def javaFile = file('src/main/java/be/zeldown/joid/internal/JOID.java')
    if (javaFile.exists()) {
        javaFile.text = javaFile.text.replaceAll(
            /public static final String VERSION = "[^"]*";/,
            "public static final String VERSION = \"${project.version}\";"
        )
    }
}

build.dependsOn updateVersion
build.dependsOn rootProject.installLocalGitHook
