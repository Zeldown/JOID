archivesBaseName = "joid-core"

evaluationDependsOn(':msdf')

configurations {
    shade
    compile.extendsFrom shade
}

dependencies {
    compile project(':msdf')

    compile "com.google.guava:guava:15.0"
    compile "com.google.code.gson:gson:2.2.4"

    compile "org.apache.commons:commons-lang3:3.1"
    compile "org.apache.commons:commons-compress:1.8.1"
    compile "commons-io:commons-io:2.4"

    compile "java3d:vecmath:1.3.1"

    shade "com.github.weisj:jsvg:2.0.0"
    shade "com.twelvemonkeys.imageio:imageio-webp:3.12.0"

    shade("org.bytedeco:javacv:1.5.9") { transitive = false }
    shade "org.bytedeco:javacpp:1.5.9"
    shade("org.bytedeco:ffmpeg:6.0-1.5.9") { transitive = false }

    shade "org.bytedeco:ffmpeg:6.0-1.5.9:windows-x86_64"
    shade "org.bytedeco:ffmpeg:6.0-1.5.9:macosx-x86_64"
    shade "org.bytedeco:ffmpeg:6.0-1.5.9:macosx-arm64"
    shade "org.bytedeco:ffmpeg:6.0-1.5.9:linux-x86_64"
}

task releaseJar(type: com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    group = 'build'
    description = 'Builds the dev or prod jar of the core, with the media libraries and the FFmpeg natives embedded.'
    from sourceSets.main.output
    from project(':msdf').sourceSets.main.output
    configurations = [project.configurations.shade]
    classifier = project.hasProperty('dev') ? 'dev' : 'prod'
    rootProject.shadeLibraries(it)

    if (!project.hasProperty('dev')) {
        rootProject.excludeDevelopment(it)
    }
}

build.dependsOn releaseJar

task updateVersion() {
    group = 'JOID'
    description = 'Writes the project version into JOID.VERSION.'
    def javaFile = file('src/main/java/dev/joid/internal/JOID.java')
    if (javaFile.exists()) {
        javaFile.text = javaFile.text.replaceAll(
            /public static final String VERSION = "[^"]*";/,
            "public static final String VERSION = \"${project.version}\";"
        )
    }
}

build.dependsOn updateVersion
build.dependsOn rootProject.installLocalGitHook
