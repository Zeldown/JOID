name: Gradle Build

on:
  push:
    branches:
      - main

env:
  LIBGL_ALWAYS_SOFTWARE: 1
  GALLIUM_DRIVER: llvmpipe

jobs:
  build:
    name: Gradle Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
      - name: Install Mesa, Lavapipe and Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl-mesa0 mesa-vulkan-drivers libvulkan1 libxxf86vm1 libxrandr2 x11-xserver-utils
      - name: Build and check the jars
        run: chmod +x gradlew && xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew build checkJars testDemoJar testProdJar --continue
      - name: Upload the reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/snapshots
            **/build/reports/tests
          retention-days: 7
