name: Gradle Build

on:
  push:
    branches:
      - main

jobs:
  pre_push:
    name: Gradle Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'adopt'
