name: Build Release

on:
  push:
    tags:
      - 'v*'

env:
  FILE_DEV: joid-*-dev.jar
  FILE_PROD: joid-*-prod.jar

jobs:
  update-version:
    name: Update Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Set up Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
      - name: Get the tag name
        id: set-tag
        run: |
          TAG_NAME=$(git describe --tags --abbrev=0)
          TAG_NAME=${TAG_NAME//[-]/ }
          TAG_NAME=${TAG_NAME:1}
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_SHA=${COMMIT_SHA:0:7}
          echo "COMMIT_SHA=${COMMIT_SHA}" >> $GITHUB_ENV
      - name: Update version in files
        run: |
          sed -i "s/project.version = \".*\"/project.version = \"${TAG_NAME}\"/g" build.gradle
          sed -i "s/version-\([^[:space:]-]*\) \([^[:space:]-]*\)-/version-${TAG_NAME} (${COMMIT_SHA})-/g" README.md
          sed -i "s/joid-[0-9]\+\.[0-9]\+\.[0-9]\+-prod\.jar/joid-${TAG_NAME}-prod.jar/g" README.md
          sed -i "s|<version>[0-9]\+\.[0-9]\+\.[0-9]\+</version>|<version>${TAG_NAME}</version>|g" README.md
          sed -i "s/public static final String VERSION = \".*\";/public static final String VERSION = \"${TAG_NAME}\";/g" src/main/java/be/zeldown/joid/internal/JOID.java
          git add README.md
          git add build.gradle
          git add src/main/java/be/zeldown/joid/internal/JOID.java
          git commit -m "update: update version to ${TAG_NAME} (:bookmark:)"
          git push origin HEAD:lwjgl-2

  build:
    name: Build
    needs: update-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lwjgl-2
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'adopt'
      - name: Build with Gradle (Dev)
        run: chmod +x gradlew && ./gradlew build -Pdev
      - name: Build with Gradle (Production)
        run: ./gradlew build
      - name: 'Upload dev artifact'
        uses: actions/upload-artifact@v4
        with:
          name: artifact-dev.jar
          path: "build/libs/${{ env.FILE_DEV }}"
          retention-days: 1
      - name: 'Upload production artifact'
        uses: actions/upload-artifact@v4
        with:
          name: artifact-prod.jar
          path: "build/libs/${{ env.FILE_PROD }}"
          retention-days: 1
  release:
    name: Upload
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: lwjgl-2
      - name: Download Dev Artifact
        uses: actions/download-artifact@v4
        with:
          name: artifact-dev.jar
      - name: Download Production Artifact
        uses: actions/download-artifact@v4
        with:
          name: artifact-prod.jar
      - name: Generate Changelog
        run: echo "# Build Release" > ${{ github.workspace }}-CHANGELOG.txt
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: ${{ github.workspace }}-CHANGELOG.txt
          files: |
            ${{ env.FILE_PROD }}
            ${{ env.FILE_DEV }}
