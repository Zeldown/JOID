name: Build Release

on:
  push:
    tags:
      - 'v*'

env:
  FILE_DEV: joid-*-dev.jar
  FILE_PROD: joid-*-prod.jar

jobs:
  update-version:
    name: Update Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Set up Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
      - name: Get the tag name
        id: set-tag
        run: |
          TAG_NAME=${GITHUB_REF_NAME//[-]/ }
          TAG_NAME=${TAG_NAME:1}
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_SHA=${COMMIT_SHA:0:7}
          echo "COMMIT_SHA=${COMMIT_SHA}" >> $GITHUB_ENV
      - name: Update version in files
        run: |
          sed -i "s/project.version = \".*\"/project.version = \"${TAG_NAME}\"/g" build.gradle
          sed -i "s/version-\([^[:space:]-]*\) \([^[:space:]-]*\)-/version-${TAG_NAME} (${COMMIT_SHA})-/g" README.md
          sed -i "s/joid-\([a-z0-9]*\)-[0-9]\+\.[0-9]\+\.[0-9]\+-prod\.jar/joid-\1-${TAG_NAME}-prod.jar/g" README.md
          sed -i "s|<version>[0-9]\+\.[0-9]\+\.[0-9]\+</version>|<version>${TAG_NAME}</version>|g" README.md
          sed -i "s/public static final String VERSION = \".*\";/public static final String VERSION = \"${TAG_NAME}\";/g" src/main/java/be/zeldown/joid/internal/JOID.java
          git add README.md
          git add build.gradle
          git add src/main/java/be/zeldown/joid/internal/JOID.java
          git commit -m "update: update version to ${TAG_NAME} (:bookmark:)"
          git push origin HEAD:main
      - name: Merge the version into the backends
        run: |
          for BRANCH in impl/lwjgl-2 impl/lwjgl-3 impl/vulkan; do
            git checkout -B "${BRANCH}" "origin/${BRANCH}"
            git merge --no-edit -m "update: merge version ${TAG_NAME} into ${BRANCH} (:bookmark:)" main
            git push origin "HEAD:${BRANCH}"
          done

  build:
    name: Build ${{ matrix.backend }}
    needs: update-version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        backend: [lwjgl-2, lwjgl-3, vulkan]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/${{ matrix.backend }}
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'adopt'
      - name: Build with Gradle (Dev)
        run: chmod +x gradlew && ./gradlew build -Pdev
      - name: Build with Gradle (Production)
        run: ./gradlew build
      - name: 'Upload artifacts'
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.backend }}
          path: |
            build/libs/${{ env.FILE_DEV }}
            build/libs/${{ env.FILE_PROD }}
          retention-days: 1

  release:
    name: Upload
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifact-*
          merge-multiple: true
      - name: Generate Changelog
        run: echo "# Build Release" > ${{ github.workspace }}-CHANGELOG.txt
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: ${{ github.workspace }}-CHANGELOG.txt
          files: |
            ${{ env.FILE_PROD }}
            ${{ env.FILE_DEV }}
