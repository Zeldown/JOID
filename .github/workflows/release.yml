name: Build Release

on:
  push:
    tags:
      - 'v*'

env:
  FILE: joid-*.jar

jobs:
  update-version:
    name: Update Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Set up Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
      - name: Get the tag name
        id: set-tag
        run: |
          TAG_NAME=$(git describe --tags --abbrev=0)
          TAG_NAME=${TAG_NAME//[-]/ }
          TAG_NAME=${TAG_NAME:1}
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_SHA=${COMMIT_SHA:0:7}
          echo "COMMIT_SHA=${COMMIT_SHA}" >> $GITHUB_ENV
      - name: Update version in files
        run: |
          sed -i "s/project.version = \".*\"/project.version = \"${TAG_NAME}\"/g" build.gradle
          sed -i "s/version-\([^[:space:]-]*\) \([^[:space:]-]*\)-/version-${TAG_NAME} (${COMMIT_SHA})-/g" README.md
          git add README.md
          git add build.gradle
          git commit -m "update: update version to ${TAG_NAME} (:bookmark:)"
          git push origin HEAD:lwjgl-2

  build:
    name: Build
    needs: update-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lwjgl-2
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'adopt'
      - name: Build with Gradle
        run: chmod +x gradlew && ./gradlew build
      - name: 'Upload artifact'
        uses: actions/upload-artifact@v4
        with:
          name: artifact.jar
          path: "build/libs/${{ env.FILE }}"
          retention-days: 1
  release:
    name: Upload
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: lwjgl-2
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: artifact.jar
      - name: Generate Changelog
        run: echo "# Build Release" > ${{ github.workspace }}-CHANGELOG.txt
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: ${{ github.workspace }}-CHANGELOG.txt
          files: |
            ${{ env.FILE }}
