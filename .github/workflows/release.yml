name: Build Release

on:
  push:
    tags:
      - 'v*'

jobs:
  update-version:
    name: Update Version
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.update.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Set up Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
      - name: Check the tagged commit
        run: |
          [ "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")" = "$(git rev-parse HEAD)" ] || { echo "The tag ${GITHUB_REF_NAME} is not on the last commit of main, tag the last commit of main"; exit 1; }
      - name: Get the tag name
        id: set-tag
        run: |
          TAG_NAME=${GITHUB_REF_NAME:1}
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_SHA=${COMMIT_SHA:0:7}
          echo "COMMIT_SHA=${COMMIT_SHA}" >> $GITHUB_ENV
      - name: Update version in files
        id: update
        run: |
          OLD_VERSION=$(sed -n 's/^    version = "\(.*\)"\r\?$/\1/p' build.gradle)
          [ -n "$OLD_VERSION" ] || { echo "No version found in build.gradle"; exit 1; }
          sed -i "s/^    version = \".*\"/    version = \"${TAG_NAME}\"/g" build.gradle
          sed -i "s/version-[^[:space:]]* ([0-9a-f]*)-/version-${TAG_NAME//-/--} (${COMMIT_SHA})-/g" README.md
          git ls-files -z documentation/src/content/docs documentation/reference documentation/examples | grep -zE '\.(md|mdx|java|gradle|txt)$' | OLD="${OLD_VERSION}" NEW="${TAG_NAME}" xargs -0 -r perl -pi -e 's/(?<![\w.^~<>])\Q$ENV{OLD}\E(?!\.?\d)/$ENV{NEW}/g'
          git add README.md
          git add build.gradle
          git add documentation/src/content/docs
          git add documentation/reference
          git add documentation/examples
          git commit -m "update: update version to ${TAG_NAME} (🔖)"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  build:
    name: Build
    needs: update-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.update-version.outputs.sha }}
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
      - name: Build with Gradle
        run: ./gradlew build checkJars -x test
      - name: 'Upload artifacts'
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: build/libs/joid-*
          retention-days: 1

  release:
    name: Upload
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts
      - name: Generate Changelog
        run: echo "# Build Release" > ${{ github.workspace }}-CHANGELOG.txt
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ github.workspace }}-CHANGELOG.txt
          files: |
            **/joid-*.jar
            **/joid-*.zip
