name: Documentation checks

on:
  push:
    branches:
      - main
    paths:
      - 'documentation/**'
      - '.github/workflows/documentation.yml'
  pull_request:
    paths:
      - 'documentation/**'
  workflow_dispatch:

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: documentation/package-lock.json
      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl-mesa0 libxxf86vm1 libxrandr2 x11-xserver-utils
      - name: Run the checks
        working-directory: documentation
        run: chmod +x ../gradlew && npm ci && xvfb-run -a -s "-screen 0 1920x1080x24" npm run check -- --fresh
