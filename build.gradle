buildscript {
    repositories {
    	mavenLocal()
        mavenCentral()
        maven { url 'https://plugins.gradle.org/m2/' }
    }
    dependencies {
        classpath 'com.github.jengelman.gradle.plugins:shadow:2.0.4'
    }
}

apply plugin: 'base'

allprojects {
    repositories {
    	mavenLocal()
        mavenCentral()
    }

    group = "dev.joid"
    version = "8.0.0"
}

def os = org.gradle.internal.os.OperatingSystem.current()
def arm = System.getProperty('os.arch').startsWith('aarch64')

ext {
    shadeLibraries = { task ->
        task.relocate 'com.github.weisj.jsvg', 'dev.joid.shaded.jsvg'
        task.relocate 'com.twelvemonkeys', 'dev.joid.shaded.twelvemonkeys'
        task.relocate 'org.objectweb.asm', 'dev.joid.shaded.asm'
        task.relocate 'com.google.gson', 'dev.joid.shaded.gson'
        task.relocate 'com.google.common', 'dev.joid.shaded.guava'
        task.relocate 'org.apache.commons.io', 'dev.joid.shaded.commons.io'
        task.relocate 'org.apache.commons.lang3', 'dev.joid.shaded.commons.lang3'
        task.relocate 'com.google.thirdparty', 'dev.joid.shaded.guava.thirdparty'
        task.exclude 'module-info.class', 'META-INF/versions/**', 'META-INF/services/javax.imageio.**', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/AL2.0', 'META-INF/LGPL2.1'
    }

    variants = ['prod', 'dev', 'demo']
    variantModules = [':core', ':backend-lwjgl2', ':backend-lwjgl3', ':backend-vulkan']

    excludeDemo = { task ->
        task.exclude 'assets/demo/**', 'dev/joid/demo/**', 'dev/joid/base/*/demo/**', 'dev/joid/backend/*/demo/**'
    }

    excludeDevelopment = { task ->
        rootProject.excludeDemo(task)
        task.exclude 'assets/dev/**', 'dev/joid/internal/font/**', 'dev/joid/lib/ui/node/impl/dev/**', 'dev/joid/base/*/snapshot/**', 'dev/joid/backend/*/snapshot/**'
    }

    excludeVariant = { task, variant ->
        if (variant == 'prod') {
            rootProject.excludeDevelopment(task)
        } else if (variant == 'dev') {
            rootProject.excludeDemo(task)
        }
    }

    lwjglVersion = "3.3.4"
    ffmpegNatives = os.isWindows() ? "windows-x86_64" : os.isMacOsX() ? (arm ? "macosx-arm64" : "macosx-x86_64") : (arm ? "linux-arm64" : "linux-x86_64")
    lwjglNatives = os.isWindows() ? "natives-windows" : os.isMacOsX() ? (arm ? "natives-macos-arm64" : "natives-macos") : (arm ? "natives-linux-arm64" : "natives-linux")
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'eclipse'

    sourceCompatibility = 1.8
    targetCompatibility = 1.8

    compileJava {
        options.encoding = 'UTF-8'
    }

    compileTestJava {
        options.encoding = 'UTF-8'
    }

    javadoc {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test) {
        systemProperty 'joid.data', file("$buildDir/data").absolutePath
        systemProperty 'joid.cache', file("$buildDir/cache").absolutePath
        systemProperty 'joid.version', project.version
    }

    dependencies {
        compile "org.projectlombok:lombok:1.18.34"

        testCompile "junit:junit:4.13.2"
        testRuntime "org.bytedeco:ffmpeg:6.0-1.5.9:$ffmpegNatives"
    }

    tasks.withType(Jar) {
        from(rootProject.file('LICENSE')) {
            into 'META-INF'
        }

        from(rootProject.file('NOTICE')) {
            into 'META-INF'
        }

        from(rootProject.file('licenses')) {
            into 'META-INF/licenses'
        }
    }

    eclipse.project.name = "JOID-${name}"
}

/* Build */
task backendTemplate(type: Zip) {
    group = 'JOID'
    description = 'Packages the template of a backend developed in its own repository.'
    baseName = 'joid-backend-template'
    destinationDir = file('build/distributions')
    from('template') {
        filter { line -> line.replace('@JOID_VERSION@', project.version.toString()) }
        rename 'gitignore', '.gitignore'
    }
    from(rootDir) {
        include 'gradlew.bat', 'gradle/wrapper/**', 'gradle/snapshots.gradle', 'LICENSE', 'NOTICE'
    }
    from(rootDir) {
        include 'gradlew'
        fileMode = 0755
    }
}

task msdfGenerator(type: Zip) {
    group = 'JOID'
    description = 'Packages the MSDF generator with its charset and its launch scripts.'
    baseName = 'joid-tool-msdf-generator'
    destinationDir = file('build/distributions')
    dependsOn ':tool-msdf:jar'

    from { project(':tool-msdf').jar.archivePath }
    from(project(':tool-msdf').file('charset.txt'))
    from(project(':tool-msdf').file('dist')) {
        include 'README.md', 'msdf.bat'
        filter { line -> line.replace('@JOID_VERSION@', project.version.toString()) }
    }
    from(project(':tool-msdf').file('dist')) {
        include 'msdf.sh'
        fileMode = 0755
        filter { line -> line.replace('@JOID_VERSION@', project.version.toString()) }
    }
    from(rootDir) {
        include 'LICENSE', 'NOTICE'
    }
}

task collectArtifacts(type: Copy) {
    group = 'JOID'
    description = 'Copies every release artifact into build/libs.'
    dependsOn ':base-glfw:releaseJar', ':base-opengl:releaseJar', ':tool-testkit:jar', ':base-openal:jar', ':tool-msdf:jar'
    dependsOn variants.collectMany { variant -> variantModules.collect { module -> "$module:${variant}Jar" } }
    from { variantModules.collectMany { module -> variants.collect { variant -> project(module).tasks["${variant}Jar"].archivePath } } }
    from { [':base-glfw', ':base-opengl'].collect { project(it).releaseJar.archivePath } }
    from { [':tool-testkit', ':tool-msdf', ':base-openal'].collect { project(it).jar.archivePath } }
    from backendTemplate
    from msdfGenerator
    into file('build/libs')
}

assemble.dependsOn collectArtifacts

task checkJars {
    group = 'JOID'
    description = 'Checks that the prod jars hold no dev tool nor demo, that only the demo jars hold the demos, that the snapshot tools of the dev jars need no demo, that the embedded libraries are relocated, that the jars carry the version of JOID, that NOTICE credits each of them, and that each jar holds one LICENSE, its NOTICE and the license text of each library it embeds under another license than Apache 2.0.'
    dependsOn ':base-glfw:releaseJar', ':base-opengl:releaseJar', ':tool-testkit:jar', ':base-openal:jar', ':tool-msdf:jar'
    dependsOn variants.collectMany { variant -> variantModules.collect { module -> "$module:${variant}Jar" } }
    doLast {
        def dev = ['dev/joid/lib/ui/node/impl/dev/DevNode.class', 'dev/joid/internal/font/', 'assets/dev/']
        def demo = ['dev/joid/demo/DemoFont.class', 'assets/demo/']
        def shaded = ['dev/joid/shaded/asm/', 'dev/joid/shaded/gson/', 'dev/joid/shaded/guava/', 'dev/joid/shaded/jsvg/', 'dev/joid/shaded/twelvemonkeys/', 'dev/joid/shaded/commons/io/', 'dev/joid/shaded/commons/lang3/']
        def libraries = ['org/objectweb/asm/', 'com/google/gson/', 'com/google/common/', 'com/google/thirdparty/', 'com/github/weisj/', 'com/twelvemonkeys/', 'org/apache/commons/io/', 'org/apache/commons/lang3/', 'javax/vecmath/']
        def credits = ['org.ow2.asm': 'ASM', 'com.google.guava': 'Guava', 'org.bytedeco': 'JavaCV and JavaCPP', 'net.java.dev.jna': 'JNA', 'com.github.weisj': 'JSVG', 'commons-io': 'Apache Commons IO', 'com.google.code.gson': 'Gson', 'com.twelvemonkeys': 'TwelveMonkeys ImageIO', 'org.apache.commons': 'Apache Commons Lang']
        def licenses = ['org.ow2.asm': ['ASM-BSD-3-Clause.txt'], 'com.github.weisj': ['JSVG-MIT.txt'], 'com.twelvemonkeys': ['TwelveMonkeys-BSD-3-Clause.txt'], 'org.lwjgl.lwjgl': ['LWJGL2-BSD-3-Clause.txt', 'OpenAL-Soft-LGPL-2.txt']]
        def notice = rootProject.file('NOTICE').readLines('UTF-8').collect { line -> line.trim() }
        def failures = []
        subprojects.collect { module -> module.configurations.findByName('shade') }.findAll { configuration -> configuration != null }.collectMany { configuration -> configuration.resolvedConfiguration.resolvedArtifacts.collect { artifact -> artifact.moduleVersion.id } }.unique { id -> "${id.group}:${id.name}" }.each { id ->
            def credit = credits.find { group, name -> id.group == group || id.group.startsWith(group + '.') }
            if (credit == null) {
                failures << "${id.group}:${id.name} is embedded but checkJars does not know its entry in NOTICE: credit it in NOTICE, then map its group in checkJars"
            } else if (!notice.any { line -> line == credit.value || line.startsWith(credit.value + ' ') }) {
                failures << "NOTICE does not credit ${credit.value}, embedded as ${id.group}:${id.name}: add its entry to NOTICE"
            }
        }
        def finds = { file, filter, pattern -> new java.util.zip.ZipFile(file).withCloseable { zip -> zip.entries().findAll { entry -> filter(entry.name) }.findAll { entry -> new String(zip.getInputStream(entry).bytes, 'ISO-8859-1') =~ pattern }.collect { entry -> entry.name } } }
        def quote = { names -> names.collect { name -> java.util.regex.Pattern.quote(name) }.join('|') }
        def classes = { name -> name.endsWith('.class') }
        def demoClass = quote(['dev/joid/demo/'])
        def library = "(?s)\\x01..(?:${quote(libraries + libraries.collect { name -> name.replace('/', '.') })})|L(?:${quote(libraries)})"
        finds(project(':tool-testkit').jar.archivePath, classes, demoClass).each { name ->
            failures << "joid-tool-testkit needs the demo class of $name"
        }
        ([':base-glfw', ':base-opengl'].collect { module -> project(module).releaseJar.archivePath } + [':tool-testkit', ':tool-msdf', ':base-openal'].collect { module -> project(module).jar.archivePath }).each { jar ->
            finds(jar, classes, library).each { name ->
                failures << "${jar.name}: $name refers to a library that is not relocated"
            }
        }
        variantModules.each { module ->
            variants.each { variant ->
                def jar = project(module).tasks["${variant}Jar"].archivePath
                def entries = new java.util.zip.ZipFile(jar).withCloseable { zip -> zip.entries().collect { entry -> entry.name } }
                def holds = { prefix -> entries.any { entry -> entry.startsWith(prefix) } }
                def windows = entries.any { entry -> entry ==~ /dev\/joid\/(base|backend)\/[^\/]+\/demo\/.*/ }
                def snapshots = entries.any { entry -> entry ==~ /dev\/joid\/(base|backend)\/[^\/]+\/snapshot\/.*/ }
                if (!holds('dev/joid/internal/JOID.class')) {
                    failures << "${jar.name} misses JOID"
                }
                (['dev/joid/internal/joid.properties'] + (module == ':core' ? [] : ["dev/joid/backend/${module - ':backend-'}/backend.properties"])).each { path ->
                    def version = new java.util.zip.ZipFile(jar).withCloseable { zip -> zip.getEntry(path)?.with { entry -> def properties = new Properties(); zip.getInputStream(entry).withCloseable { input -> properties.load(input) }; properties.getProperty('version') } }
                    if (version != project.version.toString()) {
                        failures << "${jar.name} gives the version $version instead of ${project.version} in $path"
                    }
                }
                ['META-INF/LICENSE', 'META-INF/NOTICE'].findAll { name -> entries.count(name) != 1 }.each { name ->
                    failures << "${jar.name} holds ${entries.count(name)} $name instead of one"
                }
                def groups = ([project(module)] + project(module).embeddedModules).collectMany { embedded -> ['shade', 'natives'].collect { name -> embedded.configurations.findByName(name) }.findAll { configuration -> configuration != null } }.collectMany { configuration -> configuration.resolvedConfiguration.resolvedArtifacts.collect { artifact -> artifact.moduleVersion.id.group } }
                licenses.findAll { group, texts -> groups.any { embedded -> embedded == group || embedded.startsWith(group + '.') } }.each { group, texts ->
                    texts.findAll { text -> !entries.contains('META-INF/licenses/' + text) }.each { text ->
                        failures << "${jar.name} embeds $group but misses META-INF/licenses/$text"
                    }
                }
                shaded.findAll { prefix -> !holds(prefix) }.each { prefix ->
                    failures << "${jar.name} misses $prefix"
                }
                libraries.findAll { prefix -> holds(prefix) }.each { prefix ->
                    failures << "${jar.name} holds $prefix without relocating it"
                }
                finds(jar, classes, library).each { name ->
                    failures << "${jar.name}: $name refers to a library that is not relocated"
                }
                dev.each { prefix ->
                    if (holds(prefix) != (variant != 'prod')) {
                        failures << "${jar.name} ${variant == 'prod' ? 'holds' : 'misses'} $prefix"
                    }
                }
                demo.each { prefix ->
                    if (holds(prefix) != (variant == 'demo')) {
                        failures << "${jar.name} ${variant == 'demo' ? 'misses' : 'holds'} $prefix"
                    }
                }
                if (module != ':core' && windows != (variant == 'demo')) {
                    failures << "${jar.name} ${variant == 'demo' ? 'misses' : 'holds'} its demo window"
                }
                if (module != ':core' && snapshots != (variant != 'prod')) {
                    failures << "${jar.name} ${variant == 'prod' ? 'holds' : 'misses'} its snapshot backend"
                }
                if (variant == 'dev') {
                    finds(jar, { name -> name ==~ /dev\/joid\/(base|backend)\/[^\/]+\/snapshot\/.*\.class/ }, demoClass).each { name ->
                        failures << "${jar.name}: $name needs a demo class"
                    }
                }
            }
        }
        if (!failures.isEmpty()) {
            throw new GradleException(failures.join('\n'))
        }
        println "The prod, dev and demo jars hold what they should, with their libraries relocated"
    }
}

/* Tests */
task updateSnapshots {
    group = 'JOID'
    description = 'Runs the snapshot tests of the LWJGL 2, LWJGL 3 and Vulkan backends and replaces their reference snapshots.'
    dependsOn ':backend-lwjgl2:updateSnapshots', ':backend-lwjgl3:updateSnapshots', ':backend-vulkan:updateSnapshots'
}

task crossBackendTest(type: JavaExec) {
    group = 'JOID'
    description = 'Runs the snapshot tests of every backend, then compares the LWJGL 2 and Vulkan shots to LWJGL 3.'
    dependsOn ':backend-lwjgl2:test', ':backend-lwjgl3:test', ':backend-vulkan:test'
    main = "dev.joid.test.snapshot.SnapshotComparison"
    classpath = project(':tool-testkit').sourceSets.main.runtimeClasspath
    args file('build/snapshots/cross').absolutePath, file('build/snapshots/backend-lwjgl3').absolutePath, file('build/snapshots/backend-lwjgl2').absolutePath, file('build/snapshots/backend-vulkan').absolutePath
}

task checkTemplate(type: GradleBuild) {
    group = 'JOID'
    description = 'Unpacks the backend template with the release jars in its libs folder, then compiles it.'
    dependsOn collectArtifacts
    dir = file('build/template')
    tasks = ['compileJava', 'compileTestJava', 'compileDemoJava']
    doFirst {
        delete 'build/template'
        copy {
            from zipTree(backendTemplate.archivePath)
            into 'build/template'
        }
        copy {
            from 'build/libs'
            include '*.jar'
            into 'build/template/libs'
        }
    }
}

task exportShaders(type: JavaExec) {
    group = 'JOID'
    description = 'Writes the core shaders translated into every GLSL dialect into build/shaders.'
    main = 'dev.joid.test.shader.GlslExport'
    classpath = project(':tool-testkit').sourceSets.main.runtimeClasspath
    args file('build/shaders').absolutePath
    doFirst {
        delete 'build/shaders'
    }
}

task validateShaders {
    group = 'JOID'
    description = 'Checks the core shaders translated into every GLSL dialect with glslangValidator, or the command given by -Pglslang.'
    dependsOn exportShaders
    doLast {
        def glslang = project.hasProperty('glslang') ? project.property('glslang') : 'glslangValidator'
        def failures = []
        fileTree('build/shaders').files.sort().each { shader ->
            def output = new ByteArrayOutputStream()
            def result = exec {
                commandLine glslang, shader.absolutePath
                standardOutput = output
                errorOutput = output
                ignoreExitValue = true
            }
            if (result.exitValue != 0) {
                failures << "${shader.parentFile.name}/${shader.name}: ${output}"
            }
        }
        if (!failures.isEmpty()) {
            throw new GradleException("${failures.size()} translated shaders do not compile:\n" + failures.join('\n'))
        }
        println "${fileTree('build/shaders').files.size()} translated shaders compile"
    }
}

gradle.buildFinished {
    def report = file('build/snapshots/cross/report.html')
    if (crossBackendTest.state.failure != null && report.exists()) {
        println "Cross backend report: ${report.toPath().toUri().toASCIIString()}"
    }
}

/* Scripts */
task installLocalGitHook(type: Copy) {
    group = 'JOID'
    description = 'Installs the pre-commit and pre-push git hooks, outside a continuous integration and only when they changed.'
    from('scripts') {
        include 'pre-push', 'pre-commit'
    }
    into '.git/hooks'
    onlyIf {
        System.getenv('CI') == null && file('.git').isDirectory() && ['pre-push', 'pre-commit'].any { name -> !file(".git/hooks/$name").isFile() || file(".git/hooks/$name").bytes != file("scripts/$name").bytes }
    }

    fileMode 0775
}
