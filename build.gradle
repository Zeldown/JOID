buildscript {
    repositories {
    	mavenLocal()
        mavenCentral()
        maven { url 'https://plugins.gradle.org/m2/' }
    }
    dependencies {
        classpath 'com.github.jengelman.gradle.plugins:shadow:2.0.4'
    }
}

plugins {
    id 'io.franzbecker.gradle-lombok' version '1.8' apply false
}

apply plugin: 'base'

allprojects {
    repositories {
    	mavenLocal()
        mavenCentral()
    }

    group = "dev.joid"
    version = "8.0.0"
}

ext {
    shadeLibraries = { task ->
        task.relocate 'com.github.weisj.jsvg', 'dev.joid.shaded.jsvg'
        task.relocate 'com.twelvemonkeys', 'dev.joid.shaded.twelvemonkeys'
        task.relocate 'org.objectweb.asm', 'dev.joid.shaded.asm'
        task.exclude 'module-info.class', 'META-INF/versions/**', 'META-INF/services/javax.imageio.**', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    }

    excludeDevelopment = { task ->
        task.exclude 'assets/dev/**', 'assets/demo/**', 'dev/joid/demo/**', 'dev/joid/internal/font/**', 'dev/joid/lib/ui/node/impl/dev/**'
    }

    lwjglVersion = "3.3.4"
    lwjglNatives = org.gradle.internal.os.OperatingSystem.current().isWindows() ? "natives-windows" : org.gradle.internal.os.OperatingSystem.current().isMacOsX() ? (System.getProperty("os.arch").startsWith("aarch64") ? "natives-macos-arm64" : "natives-macos") : "natives-linux"
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.franzbecker.gradle-lombok'
    apply plugin: 'eclipse'

    sourceCompatibility = 1.8
    targetCompatibility = 1.8

    compileJava {
        options.encoding = 'UTF-8'
    }

    compileTestJava {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test) {
        systemProperty 'joid.config', file("$buildDir/config").absolutePath
    }

    dependencies {
        compile "org.projectlombok:lombok:1.18.34"

        testCompile "junit:junit:4.13.2"
    }

    tasks.withType(Jar) {
        from(rootProject.file('LICENSE')) {
            into 'META-INF'
        }

        from(rootProject.file('NOTICE')) {
            into 'META-INF'
        }
    }

    eclipse.project.name = "JOID-${name}"
}

/* Build */
task backendTemplate(type: Zip) {
    group = 'JOID'
    description = 'Packages the template of a backend developed in its own repository.'
    baseName = 'joid-backend-template'
    destinationDir = file('build/distributions')
    from('template') {
        filter { line -> line.replace('@JOID_VERSION@', project.version.toString()) }
        rename 'gitignore', '.gitignore'
    }
    from(rootDir) {
        include 'gradlew.bat', 'gradle/wrapper/**', 'LICENSE', 'NOTICE'
    }
    from(rootDir) {
        include 'gradlew'
        fileMode = 0755
        filter(org.apache.tools.ant.filters.FixCrLfFilter, eol: org.apache.tools.ant.filters.FixCrLfFilter.CrLf.newInstance('lf'))
    }
}

task msdfGenerator(type: Zip) {
    group = 'JOID'
    description = 'Packages the MSDF generator with its charset and its launch scripts.'
    baseName = 'joid-msdf-generator'
    destinationDir = file('build/distributions')
    dependsOn ':msdf:jar'

    from { project(':msdf').jar.archivePath }
    from(project(':msdf').file('charset.txt'))
    from(project(':msdf').file('dist')) {
        include 'README.md', 'msdf.bat'
        filter { line -> line.replace('@JOID_VERSION@', project.version.toString()) }
    }
    from(project(':msdf').file('dist')) {
        include 'msdf.sh'
        fileMode = 0755
        filter { line -> line.replace('@JOID_VERSION@', project.version.toString()) }
        filter(org.apache.tools.ant.filters.FixCrLfFilter, eol: org.apache.tools.ant.filters.FixCrLfFilter.CrLf.newInstance('lf'))
    }
    from(rootDir) {
        include 'LICENSE', 'NOTICE'
    }
}

task collectArtifacts(type: Copy) {
    group = 'JOID'
    description = 'Copies every release artifact into build/libs.'
    dependsOn ':core:releaseJar', ':glfw:releaseJar', ':testkit:jar', ':openal:jar', ':lwjgl2:shadowJar', ':lwjgl3:shadowJar', ':vulkan:shadowJar', ':msdf:jar'
    from { [':core', ':glfw'].collect { project(it).releaseJar.archivePath } }
    from { [':lwjgl2', ':lwjgl3', ':vulkan'].collect { project(it).shadowJar.archivePath } }
    from { [':testkit', ':openal'].collect { project(it).jar.archivePath } }
    from backendTemplate
    from msdfGenerator
    into file('build/libs')
}

assemble.dependsOn collectArtifacts

/* Tests */
task crossBackendTest(type: JavaExec) {
    group = 'JOID'
    description = 'Runs the snapshot tests of every backend, then compares the LWJGL 3 and Vulkan shots to LWJGL 2.'
    dependsOn ':lwjgl2:test', ':lwjgl3:test', ':vulkan:test'
    main = "dev.joid.test.snapshot.SnapshotComparison"
    classpath = project(':testkit').sourceSets.main.runtimeClasspath
    args file('build/snapshots/cross').absolutePath, file('build/snapshots/lwjgl2').absolutePath, file('build/snapshots/lwjgl3').absolutePath, file('build/snapshots/vulkan').absolutePath
}

task exportShaders(type: JavaExec) {
    group = 'JOID'
    description = 'Writes the core shaders translated into every GLSL dialect into build/shaders.'
    main = 'dev.joid.test.shader.GlslExport'
    classpath = project(':testkit').sourceSets.main.runtimeClasspath
    args file('build/shaders').absolutePath
}

task validateShaders {
    group = 'JOID'
    description = 'Checks the core shaders translated into every GLSL dialect with glslangValidator, or the command given by -Pglslang.'
    dependsOn exportShaders
    doLast {
        def glslang = project.hasProperty('glslang') ? project.property('glslang') : 'glslangValidator'
        def failures = []
        fileTree('build/shaders').files.sort().each { shader ->
            def output = new ByteArrayOutputStream()
            def result = exec {
                commandLine glslang, shader.absolutePath
                standardOutput = output
                errorOutput = output
                ignoreExitValue = true
            }
            if (result.exitValue != 0) {
                failures << "${shader.parentFile.name}/${shader.name}: ${output}"
            }
        }
        if (!failures.isEmpty()) {
            throw new GradleException("${failures.size()} translated shaders do not compile:\n" + failures.join('\n'))
        }
        println "${fileTree('build/shaders').files.size()} translated shaders compile"
    }
}

gradle.buildFinished {
    def report = file('build/snapshots/cross/report.html')
    if (crossBackendTest.state.failure != null && report.exists()) {
        println "Cross backend report: ${report.toPath().toUri().toASCIIString()}"
    }
}

/* Scripts */
task installLocalGitHook(type: Copy){
	group = 'JOID'
	description = 'Installs the pre-commit and pre-push git hooks.'
	from(new File(rootProject.rootDir, 'scripts')) {
		include 'pre-push', 'pre-commit'
	}
	into new File(rootProject.rootDir, '.git/hooks')
	
	fileMode 0775
}
