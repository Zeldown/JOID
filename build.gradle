buildscript {
    repositories {
    	mavenLocal()
        mavenCentral()
        jcenter()
    }
    dependencies {
        classpath 'com.github.jengelman.gradle.plugins:shadow:2.0.4'
    }
}

plugins {
    id 'io.franzbecker.gradle-lombok' version '1.8' apply false
}

apply plugin: 'base'

allprojects {
    repositories {
    	mavenLocal()
        mavenCentral()
        jcenter()
    }

    group = "be.zeldown.joid"
    version = "7.0.0"
}

ext {
    lwjglVersion = "3.3.4"
    lwjglNatives = org.gradle.internal.os.OperatingSystem.current().isWindows() ? "natives-windows" : org.gradle.internal.os.OperatingSystem.current().isMacOsX() ? (System.getProperty("os.arch").startsWith("aarch64") ? "natives-macos-arm64" : "natives-macos") : "natives-linux"
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.franzbecker.gradle-lombok'
    apply plugin: 'eclipse'

    sourceCompatibility = 1.8
    targetCompatibility = 1.8

    compileJava {
        options.encoding = 'UTF-8'
    }

    dependencies {
        compile "org.projectlombok:lombok:1.18.34"

        testCompile "junit:junit:4.13.2"
    }

    eclipse.project.name = "JOID-${name}"
}

/* Build */
task backendTemplate(type: Zip) {
    group = 'JOID'
    description = 'Packages the template of a backend developed in its own repository.'
    baseName = 'joid-backend-template'
    destinationDir = file('build/distributions')
    from('template') {
        filter { line -> line.replace('@JOID_VERSION@', project.version.toString()) }
        rename 'gitignore', '.gitignore'
    }
    from(rootDir) {
        include 'gradlew.bat', 'gradle/wrapper/**'
    }
    from(rootDir) {
        include 'gradlew'
        fileMode = 0755
        filter(org.apache.tools.ant.filters.FixCrLfFilter, eol: org.apache.tools.ant.filters.FixCrLfFilter.CrLf.newInstance('lf'))
    }
}

task collectArtifacts(type: Copy) {
    group = 'JOID'
    description = 'Copies every release artifact into build/libs.'
    dependsOn ':core:releaseJar', ':testkit:jar', ':glfw:jar', ':openal:jar', ':lwjgl2:shadowJar', ':lwjgl3:shadowJar', ':vulkan:shadowJar'
    from { project(':core').releaseJar.archivePath }
    from { [':lwjgl2', ':lwjgl3', ':vulkan'].collect { project(it).shadowJar.archivePath } }
    from { [':testkit', ':glfw', ':openal'].collect { project(it).jar.archivePath } }
    from backendTemplate
    into file('build/libs')
}

assemble.dependsOn collectArtifacts

/* Tests */
task crossBackendTest(type: JavaExec) {
    group = 'JOID'
    description = 'Runs the snapshot tests of every backend, then compares the LWJGL 3 and Vulkan shots to LWJGL 2.'
    dependsOn ':lwjgl2:test', ':lwjgl3:test', ':vulkan:test'
    main = "be.zeldown.joid.test.snapshot.SnapshotComparison"
    classpath = project(':testkit').sourceSets.main.runtimeClasspath
    args file('build/snapshots/cross').absolutePath, file('build/snapshots/lwjgl2').absolutePath, file('build/snapshots/lwjgl3').absolutePath, file('build/snapshots/vulkan').absolutePath
}

gradle.buildFinished {
    def report = file('build/snapshots/cross/report.html')
    if (crossBackendTest.state.failure != null && report.exists()) {
        println "Cross backend report: ${report.toPath().toUri().toASCIIString()}"
    }
}

/* Scripts */
task installLocalGitHook(type: Copy){
	group = 'JOID'
	description = 'Installs the pre-commit and pre-push git hooks.'
	from(new File(rootProject.rootDir, 'scripts')) {
		include 'pre-push', 'pre-commit'
	}
	into new File(rootProject.rootDir, '.git/hooks')
	
	fileMode 0775
}
